      <p><strong>UNIT ROLES:</strong> <strong>Infantry</strong> fight with swords, axes or other melee weapons and never switch to ranged attacks. <strong>Archers</strong> always carry their selected bow, crossbow or javelins, prefer firing from a distance, and use their melee sidearm only when an enemy enters close-combat range. If out of ammunition, they keep their ranged weapon ready instead of charging with swords. Choose the mixed unit type for infantry and archers. <strong>Cavalry</strong> ride faster than infantry, hold wider spacing, charge with momentum, and become less effective in sustained close combat. Choose pure Cavalry, 20 infantry / 20 archers / 10 cavalry, or a grand army with all four classes. <strong>Mounted archers</strong> ride with a lighter compact horse bow (24 arrows, 710-unit range), shoot while circling, and retreat from close threats. <strong>Horse armour</strong> is separate from rider armour: leather, mail and plate barding reduce damage but slow the mount. Horses have their own health and stamina; losing a horse dismounts its rider, who continues fighting on foot. Any charging horse deals blunt impact damage even without a lance; lances add a piercing hit. Riders disengage to regroup before charging again.</p>

      <p><strong>RANGED COMBAT:</strong> V2.4 triples maximum and ideal shooting distances. Better experience and ranged familiarity produce tighter shot groups, and experienced archers lead moving targets. Archers can switch to a new enemy during an existing draw rather than repeatedly cancelling shots when their target disappears. Projectiles still travel physically and can miss. War bows carry 18 arrows (fast), crossbows carry 12 bolts (slow reload, strong piercing), and javelins carry 6 throws (short range, powerful impact). Shots follow lofted trajectories over friendly ranks and stop when they reach the ground instead of sliding along it. Lofted attacks fly over allied soldiers throughout their flight; enemy soldiers, shields and armor can still intercept them. Projectiles have travel time, can miss, and interact with directional shields and armor. Experience and independent ranged-weapon familiarity improve accuracy and timing; set Ranged skill separately from melee Mastery in Test gear. Archers draw their melee sidearm only when enemies enter close-combat range; running out of ammunition does not make them charge with swords. A shield is lowered when aiming a two-handed bow or crossbow.</p>
      <p><strong>IMPACT REACTIONS:</strong> Heavy hits cause knockback and stagger. A successful active block can create a counterattack opening; a weak shield can suffer a <strong>GUARD BREAK</strong>. Plate and solid shields can stop a swing and recoil the attacker.</p>
      <p>Green and red soldiers wear mixed armor and carry different weapons. One-handed swords can use shields; greatswords and axes occupy both hands. Swing stages: wind-up → active hitbox → recovery. In Classic Training Mode your army is invulnerable; Real Battle Mode makes both armies vulnerable.</p>

function engagementPoint(s,target){

 const flanks=[0,-.62,.62,-1.17,1.17,-1.5,1.5];
 const angle=(side<0?Math.PI:0)+flanks[s.engageSlot%flanks.length];
 const radius=weaponProfiles[s.weapon].reach*.79;
 const x=target.x+Math.cos(angle)*radius;
 let y=target.y+Math.sin(angle)*radius;
 if(Math.hypot(target.x-s.x,target.y-s.y)>115)y=y*.78+s.anchorY*.22;
 return {x:clamp(x,20,W-20),y:clamp(y,20,H-20)};
}
// Local awareness of nearby bodies creates room to approach and flank.
function avoidCombatCrowd(s,goal,target){
 let pushX=0,pushY=0;
 for(const other of [...friends,...foes]){
  if(other===s||other===target||other.dead||other.routed)continue;
  const dx=s.x-other.x,dy=s.y-other.y,d=Math.hypot(dx,dy);
  if(d<.01||d>=54)continue;
  const influence=Math.pow(1-d/54,2)*(other.team===s.team?1:.65);
  pushX+=dx/d*influence*68;pushY+=dy/d*influence*68;
 }
 const amount=Math.hypot(pushX,pushY);
 if(amount>38){pushX*=38/amount;pushY*=38/amount;}
 return {x:clamp(goal.x+pushX,18,W-18),y:clamp(goal.y+pushY,18,H-18)};
}
 // Smoothly rotate on the shortest arc, even when crossing the -PI/PI boundary.
 function turnToward(s,angle,dt){
  const delta=Math.atan2(Math.sin(angle-s.faceAngle),Math.cos(angle-s.faceAngle));
  const skillTurn=maxTurnRate*(.80+(s.skill||45)*.003);
  s.faceAngle+=clamp(delta,-skillTurn*dt,skillTurn*dt);
 }
 function updateFacing(s,target,dist,dt){
  // Maintain the army's forward direction until an enemy gets close enough.
  const forward=s.team==='friend'?0:Math.PI;
  let angle=forward;
  if(target&&dist<=facingNoticeRange){
   angle=Math.atan2(target.y-s.y,target.x-s.x);
  }
  turnToward(s,angle,dt);
 }
 // For panic, compare escape lanes; prioritize moving to safety without crossing enemy positions.
 function fleeFromEnemies(s,dt){
  const side=s.team==='friend'?-1:1;
  const threats=opponents(s).filter(e=>!e.dead&&!e.broken&&!e.routed);
  const lanes=[0,-.35,.35,-.7,.7,-1.05,1.05,-1.36,1.36];
  let best=0,bestScore=-Infinity;
  for(const angle of lanes){
   const dx=side*Math.cos(angle),dy=Math.sin(angle);
   const aheadX=s.x+dx*55,aheadY=s.y+dy*55;
   let score=dx*side*18-Math.abs(angle-s.escapeAngle)*2.5;
   if(aheadY<17||aheadY>H-17)score-=100+2*Math.abs(aheadY-clamp(aheadY,17,H-17));
   for(const e of threats){
    const near=Math.hypot(s.x+dx*25-e.x,s.y+dy*25-e.y);
    const far=Math.hypot(aheadX-e.x,aheadY-e.y);
    score-=Math.max(0,90-near)*.48+Math.max(0,90-far)*.62;
   }
   if(score>bestScore){bestScore=score;best=angle;}
  }
  s.escapeAngle=best;
  const dx=side*Math.cos(best),dy=Math.sin(best);
  approach(s,s.x+dx*100,s.y+dy*100,dt,1.95);
  turnToward(s,Math.atan2(dy,dx),dt);
  if(realismActive()){
   // approach() clamps inside the map; resolve routing when reaching the
   // retreat-side exit rather than waiting for impossible out-of-bounds x.
   if(s.team==='friend'?s.x<=14:s.x>=W-14)s.routed=true;
  }else if(s.x< -12||s.x>W+12)s.routed=true;
 }

function panic(s){
 if((!realismActive()&&s.team==='friend')||s.broken||s.dead||s.routed||s.surrendered)return;
 s.broken=true;s.brokenAt=t;s.targetId=null;s.escapeAngle=0;s.decision=0;
 const stats=combatLabStats(s.team);if(stats)stats.panics++;
 for(const n of members(s.team)){
  if(n===s||n.dead||n.broken||n.routed)continue;
  const d=Math.hypot(n.x-s.x,n.y-s.y);
  if(d<90)n.stress=clamp(n.stress+
   stressBalance.panicSpread*(1-n.disc/160)*(1-d/100),0,100);
 }
}
function handleBrokenSoldier(s,dt){
 s.attack=null;s.guardActive=false;s.guardHold=0;
 if(!realismActive()){
  s.stress=100;fleeFromEnemies(s,dt);
  if(s.routed&&s.team==='foe'&&!s.isCommander)respawnEnemy(s);
  return;
 }
 const enemies=nearbyFighting(s,85,false),allies=nearbyFighting(s,85,true);
 const commander=commanders[s.team];
 // A trapped, exhausted fleeing fighter may throw down his weapon.
 if(enemies>=2&&enemies>allies+1&&
    (s.stress>=87||s.stamina<22)&&!s.isCommander){
  s.surrendered=true;s.routed=true;s.broken=false;
  const stat=combatLabStats(s.team);if(stat)stat.surrenders++;
  return;
 }
 // A broken soldier may rally, but only with space and meaningful support.
 const commanderCanRally=commander&&!commander.dead&&!commander.routed&&
  Math.hypot(commander.x-s.x,commander.y-s.y)<230;
 const nearbySupport=!commander&&allies>=2&&s.disc>=55;
 if(t-s.brokenAt>2.2&&enemies===0&&(commanderCanRally||nearbySupport)){
  s.stress=Math.max(0,s.stress-dt*(13+s.disc*.11));
  if(s.stress<52){
   s.broken=false;s.brokenAt=-1;s.rallies++;s.decision=.2;
   s.cooldown=Math.max(s.cooldown,.45);
   const stat=combatLabStats(s.team);if(stat)stat.rallies++;
   return;
  }
 }
 fleeFromEnemies(s,dt);
 if(s.routed){const stat=combatLabStats(s.team);if(stat)stat.routes++;}
}
// Move selection balances armor vulnerability, stamina, variety and groups.
function chooseCombatMove(s,target){
 const weapon=weaponProfiles[s.weapon],available=weapon.moves;
 const threatArmor=target?.armor||'padded';
 let best=null,bestScore=-Infinity;
 const nearby=opponents(s).filter(e=>!e.dead&&!e.broken&&!e.routed&&Math.hypot(e.x-s.x,e.y-s.y)<weapon.reach+22).length;
 for(let j=0;j<available.length;j++){
  const name=available[j],m=attackMoves[name],style=attackStyles[m.style];
  // Never select a short pommel attack from full sword distance. Previously
  // high-skill fighters preferred its damage but repeatedly struck empty air.
  const distance=target?Math.hypot(target.x-s.x,target.y-s.y):0;
  if(m.short&&distance>weapon.reach*.62+8)continue;
  // A long point cannot stab a soldier inside the shaft's minimum reach.
  if(m.thrust&&isPolearm(s)&&distance<polearmMinRange(s))continue;
  const cost=style.cost*m.stamina*(.60+weapon.weight*.30)*trainingEfficiency(s);
  if(s.stamina<cost)continue;
  const raw=style.damage*weapon.power*m.mult;
  const expected=mitigatedDamage(raw,threatArmor,m.damageType);
  const choiceIndex=(s.id+s.attackCount)%available.length;
  // Rotation makes the full moveset visible while armor rewards weak spots.
  const judgment=clamp((s.skill||45)/100*.85+weaponFamiliarity(s)/100*.15,0,1);
  // Recruits choose for variety; veterans understand armor and their reach.
  let score=expected*(.25+judgment*.75)-cost*.017+
    (j===choiceIndex?1.33*(1-judgment*.58):0);
  if(name==='cleave'&&nearby>1)score+=Math.min(nearby,5)*.33;
  if(m.style==='heavy'&&s.stamina<48)score-=.75;
  if(name===s.lastMove)score-=.33;
  if(target?.shield&&m.damageType==='blunt')score+=.30;
  if(score>bestScore){best=name;bestScore=score;}
 }
 return best;
}
function beginAttack(s,target){
 if(s.attack||s.cooldown>0||s.guardActive||s.stagger>0||s.guardBreak>0||
    (isPolearm(s)&&s.braceReady>=.55&&s.braceThreatId!=null))return false;
 const weapon=weaponProfiles[s.weapon];
 if(!target||Math.hypot(target.x-s.x,target.y-s.y)>weapon.reach+9)return false;
 const name=chooseCombatMove(s,target);
 if(!name)return false;
 const move=attackMoves[name],style=attackStyles[move.style];
 const cost=style.cost*move.stamina*(.60+weapon.weight*.30)*trainingEfficiency(s)*(s.counterWindow>0?.83:1);
 if(s.stamina<cost)return false;
 s.stamina=clamp(s.stamina-cost,0,s.maxStamina);
 s.attackCount++;
 s.lastMove=name;
 s.guardActive=false;s.guardHold=0;
 const familiarity=weaponFamiliarity(s),mastery=s.skill||45;
 const counter=s.counterWindow>0;
 // Master-level familiarity smooths wind-up and recovery by ~4%.
 const fluency=clamp((familiarity-80)/17,0,1);
 const rate=weapon.speed*(1.10-mastery*.0015-familiarity*.0008)*
   (1-fluency*.04)*(s.stamina<24?1.16:1)*(counter?.82:1)*
   (isCavalry(s)&&s.gallop<.24?1.24:1);
 const wind=move.wind*rate,active=move.active*rate,recover=move.recover*rate;
 // Precision is geometrical: poorer fighters visibly swing off-target.
 const imprecision=(100-mastery)*.0031+(100-familiarity)*.0015;
 const aimError=(rnd(s.id*139+nextSwingId*43+17)-.5)*2*imprecision;
 s.counterWindow=0;
 s.attack={
  id:nextSwingId++,name,move,phase:'windup',elapsed:0,
  wind,active,recover,hitIds:new Set(),hits:0,counter,aimError,
  // Momentum gets spent on armor and shields, NOT on dealing damage.
  // Thus several naked targets can each take the complete base damage.
  momentum:weapon.momentum*move.momentum*(move.style==='heavy'?1.12:1),
  baseDamage:style.damage*weapon.power*move.mult,
  reach:weapon.reach*(move.short?.62:1)
 };
 s.cooldown=wind+active+recover+.08;
 s.recoveryDelay=wind+active+recover*.5;
 return true;
}
function weaponSegment(s,a,progress){
 const m=a.move,p=clamp(progress,0,1);
 const angle=s.faceAngle+(a.aimError||0)+(m.thrust?0:m.from+(m.to-m.from)*p);
 const reachNow=a.reach*(m.thrust?.48+.52*p:1);
 const ux=Math.cos(angle),uy=Math.sin(angle);
 return {ax:s.x+ux*9,ay:s.y+uy*9,bx:s.x+ux*reachNow,by:s.y+uy*reachNow};
}
function pointSegmentDistance(px,py,seg){
 const dx=seg.bx-seg.ax,dy=seg.by-seg.ay;
 const lenSq=dx*dx+dy*dy;
 const u=lenSq>0?clamp(((px-seg.ax)*dx+(py-seg.ay)*dy)/lenSq,0,1):0;
 return Math.hypot(px-seg.ax-dx*u,py-seg.ay-dy*u);
}
// A directional shield can catch hits passively, or be deliberately raised
// for a larger block arc, greater stopping power and more stamina spent.
function shieldImpact(attacker,defender,a){
 const shield=shieldProfiles[defender.shield];
 if(!shield||defender.guardBreak>0||defender.stamina<2)return {block:0,stop:0,kind:null};
 const incoming=Math.atan2(attacker.y-defender.y,attacker.x-defender.x);
 const delta=Math.abs(Math.atan2(Math.sin(incoming-defender.faceAngle),Math.cos(incoming-defender.faceAngle)));
 const active=defender.guardActive&&delta<=shield.activeArc;
 if(!active&&delta>shield.passiveArc)return {block:0,stop:0,kind:null};
 const weapon=a.projectile?rangedProfiles[a.projectile]:weaponProfiles[attacker.weapon];
 // A neighboring shield overlaps the defender's passive shield arc, but
 // physical spacing is required and a separated fighter loses this help.
 const wall=(defender.lineKind==='shieldwall'?
  defender.lineSupport||0:0);
 const spend=shield.cost*(active?1.15:.62)*(1+weapon.weight*.19)*
  (1-wall*.11);
 if(defender.stamina<spend)return {block:0,stop:0,kind:null};
 const stop=active?shield.activeStop:shield.passiveStop;
 const block=active?clamp(stop/Math.max(1,a.momentum),0,1):
  clamp(shield.passiveBlock+wall*.15,0,.90);
 defender.stamina=clamp(defender.stamina-spend,0,defender.maxStamina);
 defender.recoveryDelay=Math.max(defender.recoveryDelay,active?.28:.12);
 let guardBroken=false;
 if(active){
  defender.guardHold=Math.max(0,defender.guardHold-.13);
  if(block<.65||defender.stamina<9){
   defender.guardBreak=Math.max(defender.guardBreak,.36+weapon.weight*.075);
   defender.guardActive=false;
   guardBroken=true;
  }
 }
 return {block,stop,kind:active?'active':'passive',guardBroken};
}
// Skilled fighters may anticipate a visible strike and redirect the weapon.
 // Parrying is not a chance-to-ignore-damage roll at the moment of impact:
 // AI must read the wind-up, raise its weapon in time and meet a momentum test.
 function combatLabStats(team){
  return typeof labMode!=='undefined'&&labMode&&activeLab?activeLab.stats[team]:null;
 }
 function attemptWeaponParry(attacker,defender,a){
  if(defender.parryAttackId!==a.id||defender.parryWindow<=0)return null;
  defender.parryAttackId=null;defender.parryWindow=0;
  const familiarity=weaponFamiliarity(defender),skill=defender.skill||45;
  const cost=(7+weaponProfiles[attacker.weapon].weight*2.1)*trainingEfficiency(defender);
  const resistance=weaponProfiles[defender.weapon].momentum*
    (.53+skill*.0047+familiarity*.0038);
  const success=defender.stamina>=cost&&resistance>=a.momentum*.84;
  defender.stamina=clamp(defender.stamina-cost,0,defender.maxStamina);
  defender.recoveryDelay=Math.max(defender.recoveryDelay,.22);
  defender.parryPose=.30;
  if(!success){

   const stats=combatLabStats(defender.team);if(stats)stats.failedParries++;
   defender.stagger=Math.max(defender.stagger,.12);
   return {parried:false};
  }
  const stats=combatLabStats(defender.team);
  if(stats)stats.parries++;
  defender.counterWindow=.72;
  defender.guardActive=false;defender.guardHold=0;
  attacker.stagger=Math.max(attacker.stagger,.18+skill*.00065);
  attacker.cooldown=Math.max(attacker.cooldown,.28);
  reactToImpact(attacker,defender,22+weaponProfiles[attacker.weapon].weight*4);
  a.hits++;a.momentum=0;a.stopped=true;
  slashes.push({kind:'parry',block:'parry',x:defender.x,y:defender.y,
   a:Math.atan2(attacker.y-defender.y,attacker.x-defender.x),
   life:.36,duration:.36,type:a.move.style,team:defender.team});
  return {parried:true};
 }

function applyWeaponImpact(attacker,target,a){
 if(target.dead||target.routed||target.broken||target.team===attacker.team||a.hitIds.has(target.id))return false;
 a.hitIds.add(target.id);
 // A real horse presents a separate target. Projectiles and melee sweeps
 // sometimes strike its body rather than the rider (regardless of team).
 if(isCavalry(target)&&!a.horseImpact){
  const hitHorse=rnd(Math.abs(a.id)*79+target.id*31+19)<
   (a.projectile?.49:a.charge?.36:.32);
  if(hitHorse){
   const struck=applyHorseDamage(target,a.baseDamage,a.move.damageType);
   if(struck){
    a.hits++;a.momentum=0;a.stopped=true;
    slashes.push({kind:'impact',block:null,damageType:a.move.damageType,
     x:target.x,y:target.y+7,a:0,life:.30,duration:.30,
     type:a.move.style,team:attacker.team});
    return true;
   }
  }
 }
 const parry=a.projectile||a.horseImpact?null:attemptWeaponParry(attacker,target,a);
 if(parry?.parried)return true;
 const incomingMomentum=a.momentum;
 const shield=shieldImpact(attacker,target,a),damageType=a.move.damageType;
 const highGround=terrainAt(attacker.x,attacker.y);
 const defendingGround=terrainAt(target.x,target.y);
 const elevationAdvantage=a.projectile?0:clamp(
  (highGround.elevation-defendingGround.elevation)*.30,-.51,.51);
 // Uphill assault, poor footing in the water, and trees breaking horse
 // momentum can outweigh armor/weapon advantages. Dry raised defenders
 // are much harder to dislodge.
 const footingPenalty=a.projectile?1:clamp(
  1-highGround.mud*.25-highGround.water*.35-
   (isCavalry(attacker)?highGround.forest*.27:0),.48,1);
 const defenderGroundBonus=a.projectile?1:clamp(
  1+defendingGround.elevation*.20+
   defendingGround.forest*(isCavalry(attacker)?.21:.075),1,1.50);
 const afterShield=a.baseDamage*(1+elevationAdvantage)*footingPenalty*
  (1-shield.block)/defenderGroundBonus;
 const actual=mitigatedDamage(afterShield,target.armor,damageType);
 const weapon=a.projectile?rangedProfiles[a.projectile]:weaponProfiles[attacker.weapon],heavy=a.move.style==='heavy';
 // Physical hits and blocks happen regardless of friendly health immunity.
 if(target.team==='foe'||target.isCommander||realismActive()){
  target.hp=Math.max(0,target.hp-actual);
  const style=attackStyles[a.move.style];

 if(s.broken){ctx.strokeStyle='#ff795e';ctx.lineWidth=1.9;ctx.beginPath();ctx.arc(x,y,14,0,2*Math.PI);ctx.stroke();}
 if(s.stagger>0){
  ctx.strokeStyle='rgba(255,199,115,'+clamp(s.stagger/.53,0,1)*.62+')';
  ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12.8+s.impactLean*3,0,Math.PI*2);ctx.stroke();
 }
 const stress=s.stress/100;
 ctx.beginPath();ctx.ellipse(x,y+7,8,3.3,0,0,Math.PI*2);ctx.fillStyle='#06161188';ctx.fill();
 ctx.beginPath();ctx.arc(x,y,9.6,0,2*Math.PI);ctx.fillStyle=s.hitFlash>0?'#fff0b0':(s.broken?'#ed9b63':s.team==='friend'? (stress>.6?'#e1c064':stress>.3?'#9cc978':'#61d8a6'):(stress>.65?'#e6ad63':'#e47b74'));ctx.fill();ctx.strokeStyle=s.team==='friend'?'#ddffe1':'#ffe1da';ctx.lineWidth=1.2;ctx.stroke();
 // A narrow armor-colored helmet stripe distinguishes padded/leather/mail/plate.
 ctx.fillStyle=armorProfiles[s.armor]?.color||'#e5efe9';ctx.fillRect(x-5,y-7.5,10,2.6);
 // Small gold/silver badge distinguishes experienced fighters from recruits.
 if(s.experience==='elite'||s.experience==='veteran'){
  ctx.fillStyle=s.experience==='elite'?'#f3d88a':'#b9dcd1';
  ctx.beginPath();ctx.arc(x,y-11.8,s.experience==='elite'?2.8:2.2,0,Math.PI*2);ctx.fill();
 }
 ctx.fillStyle='#ffffff40';ctx.beginPath();ctx.arc(x-2.5,y-3,2.7,0,2*Math.PI);ctx.fill();
 // Shields stay in front and visibly rise to defend incoming blows.
 const shield=shieldProfiles[s.shield];
 // Two-handed bows/crossbows occupy both hands; any shield returns when
 // the archer switches to their close-combat weapon.
 if(shield&&!(isArcher(s)&&!s.meleeReady&&!s.attack&&rangedProfiles[s.ranged]?.twoHand)){
  const recoil=clamp(s.shieldRecoil/.26,0,1);
  ctx.save();ctx.translate(x-Math.cos(s.faceAngle)*recoil*4,y-Math.sin(s.faceAngle)*recoil*4);
  ctx.rotate(s.faceAngle+recoil*.25);
  ctx.fillStyle=s.guardBreakFlash>0?'#c47869':s.guardActive?'#f1eac0':shield.color;
  ctx.strokeStyle=s.guardActive?'#fff9cb':'#625544';
  ctx.lineWidth=s.guardActive?2.4:1.4;
  ctx.beginPath();ctx.ellipse(10,0,shield.size*.58,shield.size*.41,0,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#6b5c4d';ctx.fillRect(9,-shield.size*.2,2,shield.size*.4);
  if(s.guardActive){
   ctx.strokeStyle='#abeddfbb';ctx.lineWidth=2.4;
   ctx.beginPath();ctx.arc(0,0,shield.size+12,-.9,.9);ctx.stroke();
  }
  if(s.guardBreakFlash>0){
   ctx.strokeStyle='rgba(255,114,89,'+clamp(s.guardBreakFlash/.58,0,1)+')';
   ctx.lineWidth=3;
   ctx.setLineDash([4,4]);ctx.beginPath();
   ctx.arc(0,0,shield.size+14,-1.12,1.12);ctx.stroke();
   ctx.setLineDash([]);
  }
  ctx.restore();
 }
 // Weapons physically move throughout wind-up, active and recovery phases.
 if(isArcher(s)&&s.ranged&&!s.attack&&!s.meleeReady){
  const rp=rangedProfiles[s.ranged];
  ctx.save();ctx.translate(x,y);ctx.rotate(s.faceAngle);
  ctx.strokeStyle=rp.color;ctx.lineWidth=2.5;ctx.beginPath();
  if(s.ranged==='bow'||s.ranged==='horsebow'){
   const bowRadius=s.ranged==='horsebow'?10:14;
   ctx.arc(11,0,bowRadius,-1.1,1.1);ctx.stroke();
   ctx.strokeStyle='#f6e9c7';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(11+bowRadius*Math.cos(-1.1),bowRadius*Math.sin(-1.1));
   ctx.lineTo(s.rangedAim>0?4:11,0);ctx.lineTo(11+bowRadius*Math.cos(1.1),bowRadius*Math.sin(1.1));ctx.stroke();
  }else if(s.ranged==='crossbow'){
   ctx.moveTo(5,0);ctx.lineTo(24,0);ctx.moveTo(17,-11);ctx.lineTo(17,11);ctx.stroke();
   ctx.strokeStyle='#f9eac7';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(17,-11);ctx.lineTo(7,0);ctx.lineTo(17,11);ctx.stroke();
  }else{
   ctx.moveTo(6,0);ctx.lineTo(30,0);ctx.stroke();
   ctx.fillStyle=rp.color;ctx.beginPath();ctx.moveTo(32,0);
   ctx.lineTo(26,-3);ctx.lineTo(26,3);ctx.closePath();ctx.fill();
  }
  ctx.restore();
 }else{
 const wp=weaponPose(s);
 if(s.parryPose>0){
  ctx.save();ctx.translate(x,y);ctx.rotate(s.faceAngle-.62);
  ctx.strokeStyle='rgba(154,242,247,'+clamp(s.parryPose/.30,0,1)+')';
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(7,-14);ctx.lineTo(23,6);ctx.stroke();
  ctx.restore();
 }
 ctx.save();ctx.translate(x,y);ctx.rotate(wp.angle);
 if(s.attack?.phase==='active'&&!s.attack.move.thrust){
  ctx.strokeStyle=s.attack.move.damageType==='blunt'?'#e8a86866':'#fff0aa66';
  ctx.lineWidth=s.weapon==='axe'?7:4;
  const m=s.attack.move,progress=s.attack.elapsed/s.attack.active;
  ctx.beginPath();
  for(let j=0;j<=5;j++){
   const q=clamp(progress-j*.055,0,1);
   const theta=m.from+(m.to-m.from)*q-wp.angle+s.faceAngle;
   const px=Math.cos(theta)*wp.length,py=Math.sin(theta)*wp.length;
   if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
 }
 ctx.fillStyle='#f4ffe1';ctx.beginPath();ctx.arc(7,0,2.1,0,Math.PI*2);ctx.fill();
 if(s.weapon==='axe'){
  ctx.strokeStyle='#ad8258';ctx.lineWidth=3.2;
  ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(wp.length,0);ctx.stroke();
  ctx.fillStyle='#d8e2e4';ctx.strokeStyle='#f4eded';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(wp.length-9,-8);ctx.lineTo(wp.length+2,-11);
  ctx.lineTo(wp.length+2,11);ctx.lineTo(wp.length-9,8);ctx.closePath();ctx.fill();ctx.stroke();
 }else if(isPolearm(s)){
  // Spear shafts and bright forward tips stay visible even in a dense wall.
  const length=wp.length;
  ctx.strokeStyle='#ad8555';ctx.lineWidth=s.weapon==='pike'?3.2:2.8;
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(length-8,0);ctx.stroke();
  ctx.fillStyle='#e1eaf0';ctx.strokeStyle='#f5fbff';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.moveTo(length+4,0);
  ctx.lineTo(length-9,-(s.weapon==='pike'?4.4:3.6));
  ctx.lineTo(length-9,s.weapon==='pike'?4.4:3.6);
  ctx.closePath();ctx.fill();ctx.stroke();
 }else{
  ctx.strokeStyle='#aa7b55';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(12,0);ctx.stroke();
  ctx.strokeStyle='#f1d2a2';ctx.lineWidth=2.1;
  ctx.beginPath();ctx.moveTo(12,s.weapon==='greatsword'?-5:-3.5);ctx.lineTo(12,s.weapon==='greatsword'?5:3.5);ctx.stroke();
  ctx.strokeStyle='#edf2f7';ctx.lineWidth=s.weapon==='greatsword'?3.3:2.35;
  ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(wp.length,0);ctx.stroke();
 }
 ctx.restore();
 }
 // An amber counter below the fighter shows ammunition remaining.
 if(s.ranged){
  ctx.font='bold 9px system-ui';ctx.textAlign='center';
  ctx.fillStyle=(infiniteAmmo||s.ammo>0)?rangedProfiles[s.ranged].color:'#b4aba2';
  ctx.fillText(infiniteAmmo?'∞':String(s.ammo),x+17,y+19);
 }
 // A golden arc fills as the soldier plants a ready anti-horse point.
 if(isPolearm(s)&&(s.braceReady||0)>.05){
  ctx.beginPath();ctx.arc(x,y,14,s.faceAngle-.77,
   s.faceAngle-.77+1.54*clamp(s.braceReady,0,1));
  ctx.strokeStyle=s.braceReady>=.65?'#f6de8b':'#bcaa7366';
  ctx.lineWidth=2.8;ctx.stroke();
 }
 // Thin stress arc makes each soldier's personal stress legible.
 if(s.stress>12){ctx.beginPath();ctx.arc(x,y,12,-Math.PI/2,-Math.PI/2+stress*2*Math.PI);ctx.strokeStyle=s.stress>70?'#f16d53':'#e6c368';ctx.lineWidth=2;ctx.stroke();}
 if(s.hp<3&&!s.broken){ctx.fillStyle='#101c18';ctx.fillRect(x-10,y-17,20,3);ctx.fillStyle=s.team==='friend'?'#99e99d':'#f6a4a2';ctx.fillRect(x-10,y-17,20*s.hp/3,3);}
 // A thin blue meter under each soldier shows remaining stamina.
 ctx.fillStyle='#0d2424';ctx.fillRect(x-10,y+14,20,3);
 ctx.fillStyle=s.stamina<25?'#eea86d':'#7fd7da';
 ctx.fillRect(x-10,y+14,20*clamp(s.stamina/s.maxStamina,0,1),3);
}
function draw(){
 if(!VW)return;
 ctx.clearRect(0,0,VW,VH);
 ctx.save();ctx.translate(-camera.x,-camera.y);
 background();drawCommanderTerrainPlans();if(marker){const age=t-marker.when;if(age<1.3){ctx.beginPath();ctx.arc(marker.x,marker.y,14+age*11,0,2*Math.PI);ctx.strokeStyle='rgba(211,255,218,'+(1-age/1.3)*.6+')';ctx.lineWidth=2;ctx.stroke();}else marker=null;}
 // Selection means selected soldiers are highlighted, but never hides their stats or swords.
 for(const s of foes)drawUnit(s);for(const s of friends)drawUnit(s);
 for(const team of ['foe','friend'])if(commanders[team])drawUnit(commanders[team]);
 drawRangedProjectiles(ctx,projectiles);
 for(const sl of slashes){
  ctx.save();ctx.translate(sl.x,sl.y);ctx.rotate(sl.a);
  const opacity=clamp(sl.life/sl.duration,0,1);
  ctx.strokeStyle=sl.guardBroken?'rgba(255,103,88,'+opacity+')':sl.kind==='parry'?'rgba(128,255,238,'+opacity+')':sl.block?'rgba(141,235,249,'+opacity+')':
    sl.damageType==='blunt'?'rgba(255,179,103,'+opacity+')':
    sl.team==='friend'?'rgba(251,240,168,'+opacity+')':'rgba(255,181,159,'+opacity+')';
  ctx.lineWidth=sl.block?2.7:sl.type==='heavy'?3.6:2.3;
  ctx.beginPath();
  if(sl.block){ctx.arc(0,0,8+(1-opacity)*(sl.guardBroken?13:8),0,Math.PI*2);}
  else{ctx.moveTo(-6,-5);ctx.lineTo(6,5);ctx.moveTo(-6,5);ctx.lineTo(6,-5);}
  ctx.stroke();
   if(sl.guardBroken||sl.kind==='parry'){
    ctx.save();ctx.rotate(-sl.a);
    ctx.fillStyle='rgba(255,193,160,'+opacity+')';
    ctx.font='bold 10px system-ui';ctx.textAlign='center';
    ctx.fillText(sl.kind==='parry'?'PARRY!':'GUARD BREAK',0,-20-(1-opacity)*10);
    ctx.restore();
   }
   ctx.restore();
  }
  ctx.restore();
  drawMinimap();
}
function drawMinimap(){
  if(!W)return;
  const mw=mini.width,mh=mini.height;
  mctx.clearRect(0,0,mw,mh);
  mctx.fillStyle='#152b24';mctx.fillRect(0,0,mw,mh);
  mctx.strokeStyle='#6e957d';mctx.lineWidth=2;mctx.strokeRect(1,1,mw-2,mh-2);
  // Terrain also appears on the strategic minimap, so the General can
  // identify slopes, cover and obstacles before issuing a formation order.
  for(const z of terrainZones){
   mctx.fillStyle={hill:'#9fc38695',forest:'#28664aaa',mud:'#78644caa',
    water:'#65a8ceae',rock:'#bdc3c0e0'}[z.kind]||'#627d65';
   mctx.beginPath();
   mctx.ellipse(z.x/W*mw,z.y/H*mh,Math.max(2,z.rx/W*mw),
    Math.max(2,z.ry/H*mh),0,0,Math.PI*2);mctx.fill();
  }
  for(const team of ['friend','foe']){
   const brain=commanderBrains[team],pos=brain?.terrainPlan;
   if(!pos||!['seizeGround','holdGround','guardCrossing'].includes(brain.phase))continue;
   mctx.fillStyle=team==='friend'?'#ffe19e':'#ff9f91';
   mctx.beginPath();mctx.arc(pos.x/W*mw,pos.y/H*mh,3.4,0,Math.PI*2);mctx.fill();
  }
  for(const s of foes){if(s.routed||s.dead)continue;mctx.fillStyle='#e47b74';mctx.fillRect(s.x/W*mw-2,s.y/H*mh-2,4,4);}
  for(const s of friends){if(s.routed||s.dead)continue;mctx.fillStyle='#65e4a5';mctx.fillRect(s.x/W*mw-2,s.y/H*mh-2,4,4);}
  for(const team of ['friend','foe']){const c=commanders[team];if(!c||c.dead)continue;
   mctx.fillStyle='#ffe497';mctx.fillRect(c.x/W*mw-4,c.y/H*mh-4,8,8);}
  mctx.strokeStyle='#f5ebbd';mctx.lineWidth=1.8;
  mctx.strokeRect(camera.x/W*mw,camera.y/H*mh,Math.min(mw,VW/W*mw),Math.min(mh,VH/H*mh));
 }
 function resize(){
  const b=board.getBoundingClientRect();
  VW=Math.max(240,b.width);VH=Math.max(180,b.height);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(VW*dpr);canvas.height=Math.round(VH*dpr);
  canvas.style.width=VW+'px';canvas.style.height=VH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!friends.length&&!commanders.friend){
   // Increase playable battlefield AREA by exactly three times, preserving
   // the original shape and soldier/weapon scale.
   const worldScale=Math.sqrt(3);
   W=Math.max(1500,VW*1.7)*worldScale;
   H=Math.max(860,VH*1.7)*worldScale;
   populate();
  }else{
   // Keep world coordinates fixed while the phone/browser changes dimensions.
   W=Math.max(W,VW+120);H=Math.max(H,VH+120);
   camera.x=clamp(camera.x,0,Math.max(0,W-VW));
   camera.y=clamp(camera.y,0,Math.max(0,H-VH));
  }
  draw();
 }
function frame(ts){
  if(!last)last=ts;
  const dt=Math.min((ts-last)/1000,.040);
  last=ts;
  if(!equipmentOpen&&!battleOutcome)t+=dt;
  const panSpeed=600*dt;
  if(!campaignMode){
   if(cameraKeys.has('arrowleft')||cameraKeys.has('a'))camera.x-=panSpeed;
   if(cameraKeys.has('arrowright')||cameraKeys.has('d'))camera.x+=panSpeed;
   if(cameraKeys.has('arrowup')||cameraKeys.has('w'))camera.y-=panSpeed;
   if(cameraKeys.has('arrowdown')||cameraKeys.has('s'))camera.y+=panSpeed;
  }else if(commanders.friend){
   camera.x=commanders.friend.x-VW*.5;
   camera.y=commanders.friend.y-VH*.5;
   const hero=commanders.friend;
   document.querySelector('#campaignBattleHeroHealth').textContent=
    'Hero: '+Math.round(Math.max(0,hero.hp)/Math.max(1,hero.maxHp)*100)+'%';
  }
  camera.x=clamp(camera.x,0,Math.max(0,W-VW));
  camera.y=clamp(camera.y,0,Math.max(0,H-VH));
  if(!equipmentOpen&&!battleOutcome)step(dt);
  draw();
  if(!equipmentOpen&&Math.floor(t*4)!==Math.floor((t-dt)*4))updateUI();
  requestAnimationFrame(frame);
 }
// Campaign controls are limited to leaving or returning from the battle.
if(campaignMode){
 document.querySelector('#campaignControlToggle').addEventListener('click',()=>setCampaignControlMode(campaignControlMode==='auto'?'manual':'auto'));
 const armyPanel=document.querySelector('#campaignArmyOrders'),armyToggle=document.querySelector('#campaignArmyOrdersToggle');
 const armyOrderName={attack:'Advance',defend:'Hold the line',stop:'Stand ground',retreat:'Retreat'};
 const updateCampaignArmyOrders=()=>{
  document.querySelectorAll('[data-campaign-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.campaignGroup===selectedGroup?'true':'false'));
  const overrides=Object.entries(generalOrders).filter(([,v])=>!!v);
  document.querySelector('#campaignOrderStatus').textContent=overrides.length?
   'Standing order: '+overrides.map(([group,order])=>(group==='all'?'Whole army':group)+' · '+(armyOrderName[order]||order)).join(' · '):
   'Your commander is managing the troops.';
 };
 armyToggle.addEventListener('click',()=>{armyPanel.hidden=!armyPanel.hidden;armyToggle.setAttribute('aria-expanded',armyPanel.hidden?'false':'true');updateCampaignArmyOrders()});
 document.querySelectorAll('[data-campaign-group]').forEach(b=>b.addEventListener('click',()=>{selectedGroup=b.dataset.campaignGroup;updateCampaignArmyOrders()}));
 document.querySelectorAll('[data-campaign-order]').forEach(b=>b.addEventListener('click',()=>{
  const order=b.dataset.campaignOrder;
  if(order==='auto'){returnToCommander(selectedGroup);updateCampaignArmyOrders();return}
  selected=true;setMode(order);updateCampaignArmyOrders();
  ui.hint.textContent=(selectedGroup==='all'?'WHOLE ARMY':selectedGroup.toUpperCase())+' · '+(armyOrderName[order]||order);
 }));
 document.querySelector('#campaignThrowRock').addEventListener('click',throwCampaignRock);
 window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(campaignControlMode==='manual'&&['w','a','s','d',' ','shift'].includes(key)){heroKeys.add(key);e.preventDefault()}
  if(campaignControlMode==='manual'&&key==='g'){throwCampaignRock();e.preventDefault()}
 });
 window.addEventListener('keyup',e=>heroKeys.delete(e.key.toLowerCase()));
 window.addEventListener('blur',()=>{heroKeys.clear();heroAttackHeld=false});
 canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect();heroPointer={x:camera.x+e.clientX-rect.left,y:camera.y+e.clientY-rect.top}});
 canvas.addEventListener('pointerdown',e=>{if(campaignControlMode==='manual'&&e.button===0){heroAttackHeld=true;e.preventDefault()}});
 window.addEventListener('pointerup',()=>heroAttackHeld=false);
 document.querySelectorAll('[data-hero-key]').forEach(button=>{
  const key=button.dataset.heroKey;
  const down=e=>{if(campaignControlMode!=='manual')return;e.preventDefault();e.stopPropagation();if(key==='attack')heroAttackHeld=true;else heroKeys.add(key)};
  const up=e=>{e.preventDefault();e.stopPropagation();if(key==='attack')heroAttackHeld=false;else heroKeys.delete(key)};
  button.addEventListener('pointerdown',down);button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up);
 });
 document.querySelector('#campaignBattleExit').addEventListener('click',campaignReturn);
 document.querySelector('#campaignBattleReturn').addEventListener('click',campaignReturn);
}else{
 document.querySelector('#campaignBattleBanner').style.display='none';
}
window.addEventListener('resize',resize,{passive:true});if('ResizeObserver' in window)new ResizeObserver(resize).observe(board);resize();requestAnimationFrame(frame);
})();
</script>
